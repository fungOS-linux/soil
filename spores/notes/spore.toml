schema = 1

[spore]
id = "dev.fungos.notes"
name = "notes"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
summary = "Local-first Markdown notes with search, links, outlines and presentation"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { vfs = "1.0.0", vfs-mut = "0.1.0", index = "1.1.0", graph = "0.1.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/editor.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
surfaces = ["canvas", "native", "web"]

[grants]
"soil:vfs" = "read Markdown notes from the host-approved workspace root"
"soil:index" = "search indexed note paths and text"
"soil:graph" = "read backlinks for host-mapped note nodes"
"soil:vfs-mut" = "save notes with generation-checked workspace writes"

[denied]
"soil:http" = ["network access is a separate explicit host grant"]
"wasi:filesystem" = ["the host owns the notes root and paths"]
