schema = 1

[spore]
id = "dev.fungos.dfm"
name = "dfm-report"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
summary = "DFM findings for a model, with a native wgpu 3D view of the flagged geometry"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"

[module]
path = "module.wasm"

[ui]
entry = "ui/report.lua"
jit = true
hot_reload = true

[launch]
default = "native"
surfaces = ["native", "canvas", "web"]

[assets]
scene = { path = "model/data.json", media_type = "application/json" }

[grants]
"soil:vfs" = "read the bundled DFM scene so the report can be listed"

[denied]
"soil:http" = ["findings are host-supplied; the Spore has no network path"]
"wasi:filesystem" = ["the host owns the workspace root"]
