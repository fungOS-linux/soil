schema = 1

[spore]
id = "dev.fungos.feeds"
name = "feeds"
version = "0.1.0"
license = "MIT"
summary = "Reader Spore for RSS/Atom items stored in records"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { appdata = "1.0.0", records = "0.1.0", http = "0.1.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/editor.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
surfaces = ["canvas", "native", "web"]

[grants]
"soil:appdata" = "read/write the private reader settings"
"soil:records" = "read/write feed items in the host-mapped collection"
"soil:http" = "fetch user-approved feed URLs"
