schema = 1

[spore]
id = "dev.fungos.consent"
name = "consent"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
summary = "Trusted host consent popup for Unibus, Spore Store and outbound actions"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"

[module]
path = "module.wasm"

[ui]
entry = "ui/consent.lua"

[launch]
default = "native"
surfaces = ["native"]

[grants]
