schema = 1

[spore]
id = "dev.fungos.contacts"
name = "contacts"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
summary = "Personal contacts with explicit CRM projections"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { records = "0.1.0" }

[module]
path = "module.wasm"

[ui]
entry = "ui/editor.lua"
jit = true
hot_reload = true

[launch]
default = "canvas"
surfaces = ["canvas", "native", "web"]

[grants]
"soil:records" = "read/write personal contacts and write explicit CRM projections"

[denied]
"soil:http" = ["contact data has no network authority"]
"wasi:filesystem" = ["the host maps namespaces to books"]
