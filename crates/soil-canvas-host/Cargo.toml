[package]
name = "soil-canvas-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde_json = "1"
soil-scene = { path = "../soil-scene" }
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile = "3"
