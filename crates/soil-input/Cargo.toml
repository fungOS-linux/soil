[package]
name = "soil-input"
description = "Host-neutral pointer, key, focus and IME events for Soil hosts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
winit = ["dep:winit"]

[dependencies]
serde = { version = "1", features = ["derive"] }
winit = { version = "0.30", optional = true }

[dev-dependencies]
serde_json = "1"
