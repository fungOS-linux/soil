[package]
name = "soil-command"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soil-appdata-host = { path = "../soil-appdata-host" }
soil-audio-host = { path = "../soil-audio-host" }
soil-records-host = { path = "../soil-records-host" }
soil-vfs-host = { path = "../soil-vfs-host" }
toml = "0.8"
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "soil-command"
path = "src/bin/soil-command.rs"
