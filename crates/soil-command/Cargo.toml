[package]
name = "soil-command"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
soil = { path = "../soil" }
# A Spore can install commands, so the registry reads Spore manifests too.
soil-spore = { path = "../soil-spore" }
toml = "0.8"
# `cache` is wasmtime's own AOT cache: compiled components are kept on disk
# and keyed by engine version, so a command that runs 500 times a day is
# compiled once. It is the same mechanism the launcher needs; enabling it
# here rather than hand-rolling a .cwasm directory keeps one answer for
# "how does a component start hot".
wasmtime = { version = "50", features = ["anyhow", "cache"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "soil-command"
path = "src/bin/soil-command.rs"
