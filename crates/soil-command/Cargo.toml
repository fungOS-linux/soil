[package]
name = "soil-command"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soil-host = { path = "../soil-host" }
# A Spore can install commands, so the registry reads Spore manifests too.
soil-spore = { path = "../soil-spore" }
toml = "0.8"
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "soil-command"
path = "src/bin/soil-command.rs"
