[package]
name = "soil-notify-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/fungOS-linux/soil"
publish = false

[dependencies]
anyhow = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
unibus = { git = "https://github.com/fungOS-linux/unibus.git", rev = "8bf8f79" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

