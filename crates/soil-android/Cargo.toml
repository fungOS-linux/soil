[package]
name = "soil-android"
description = "JNI bridge for the Soil Canvas runtime on Android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "soil_android"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "0.21"
soil-runtime = { path = "../soil-runtime" }
