[package]
name = "soil-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["model2vec"]
model2vec = ["dep:model2vec-rs"]
remote = []

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
fungos-records.workspace = true
fungos-vfs = { git = "https://github.com/mycelium-linux/fungos-vfs.git", rev = "8ad45a7fb1ce01fbbc6f764d10524baf5a24c0af" }
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
ipnet = "2"
model2vec-rs = { version = "0.4", default-features = false, features = ["fancy-regex", "hf-hub"], optional = true }
percent-encoding = "2"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
unibus = { git = "https://github.com/mycelium-linux/unibus.git", rev = "8bf8f79" }
unibus-sdk = { git = "https://github.com/mycelium-linux/unibus.git", rev = "8bf8f79" }
url = "2"
ureq = { version = "2", features = ["json"] }
wasmtime = { version = "50", default-features = false, features = [
    "anyhow",
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "50", default-features = false, features = [
    "default-send-request",
    "p2",
] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "soil-wasi-http"
path = "src/bin/soil-wasi-http.rs"
