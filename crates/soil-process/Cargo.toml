[package]
name = "soil-process"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
cpal = "0.18"
rtrb = "0.4"
wasmtime = { version = "50", default-features = false, features = [
    "anyhow",
    "cranelift",
    "runtime",
    "std",
    "threads",
] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p1"] }

[[bin]]
name = "soil-cpal"
path = "src/bin/soil-cpal.rs"
