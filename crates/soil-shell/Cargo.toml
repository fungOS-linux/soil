[package]
name = "soil-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "soil"
path = "src/main.rs"

[dependencies]
anyhow = "1"
fungos-vfs = { git = "https://github.com/fungOS-linux/fungos-vfs.git", rev = "a41aaceeef21b24739900d7ef65b434afe24a706" }
soil-vfs-host = { path = "../soil-vfs-host" }
# Hosting any `.spore`: the launcher is the generic one, so it links the host
# instead of re-implementing it per product.
soil-http-host = { path = "../soil-http-host" }
soil-spore = { path = "../soil-spore" }
soil-web-bridge = { path = "../soil-web-bridge" }
soil-wasi-host = { path = "../soil-wasi-host" }
http = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unibus = { git = "https://github.com/fungOS-linux/unibus.git", rev = "8bf8f79" }

[dev-dependencies]
tempfile = "3"
