[package]
name = "soil-wasi-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
serde_json = "1"
tracing = "0.1"
unibus = { git = "https://github.com/fungOS-linux/unibus.git", rev = "8bf8f79" }
unibus-sdk = { git = "https://github.com/fungOS-linux/unibus.git", rev = "8bf8f79" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
ipnet = "2"
sha2 = "0.10"
soil-records-host = { path = "../soil-records-host" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
wasmtime = { version = "50", default-features = false, features = [
    "anyhow",
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "50", default-features = false, features = [
    "default-send-request",
    "p2",
] }

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[[bin]]
name = "soil-wasi-http"
path = "src/bin/soil-wasi-http.rs"
