[package]
name = "canvas-winit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "canvas-winit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
portable-pty = "0.9"
softbuffer = "0.4"
url = "2"
soil = { path = "../soil", default-features = false, features = ["http", "principal", "vfs"] }
soil-spore = { path = "../soil-spore" }
soil-vt = { path = "../soil-vt" }
soil-webgpu = { path = "../soil-webgpu" }
winit = "0.30"
