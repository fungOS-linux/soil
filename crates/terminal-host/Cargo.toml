[package]
name = "terminal-host"
description = "Native Mycelium + PTY host for the terminal Spore"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "terminal-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
portable-pty = "0.9"
minifb = "0.28"
font8x8 = "0.3"
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = "50"
