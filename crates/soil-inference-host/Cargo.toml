[package]
name = "soil-inference-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soil-inference = { path = "../soil-inference" }
soil-scrub = { path = "../soil-scrub" }
ureq = { version = "2", features = ["json"] }
wasmtime = { version = "50", features = ["anyhow"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
