[package]
name = "soil-principal-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
mycelium = ["dep:mycelium-peer-protocol"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "50", features = ["anyhow"] }
mycelium-peer-protocol = { git = "https://github.com/ajmwagar/mycelium.git", rev = "83a8cf8a818c29db84845eba8128477f38ab39ca", optional = true }

[dev-dependencies]
ed25519-dalek = "2.2"
tempfile = "3"
