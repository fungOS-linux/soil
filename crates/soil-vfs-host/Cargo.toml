[package]
name = "soil-vfs-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["model2vec"]
model2vec = ["dep:model2vec-rs"]
remote = ["dep:serde_json", "dep:ureq"]

[dependencies]
anyhow = "1"
blake3 = "1"
fungos-vfs = { git = "https://github.com/fungOS-linux/fungos-vfs.git", rev = "001a1dca542acdae6bfc9ba81679bf2948501976" }
model2vec-rs = { version = "0.4", default-features = false, features = ["fancy-regex", "hf-hub"], optional = true }
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = { version = "1", optional = true }
ureq = { version = "2", features = ["json"], optional = true }
wasmtime = { version = "50", features = ["anyhow"] }

[dev-dependencies]
tempfile = "3"
