[package]
name = "soil-vfs-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["model2vec"]
model2vec = ["dep:model2vec-rs"]
remote = ["dep:ureq"]

[dependencies]
anyhow = "1"
blake3 = "1"
fungos-vfs = { git = "https://github.com/fungOS-linux/fungos-vfs.git", rev = "a41aaceeef21b24739900d7ef65b434afe24a706" }
model2vec-rs = { version = "0.4", default-features = false, features = ["fancy-regex", "hf-hub"], optional = true }
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
ureq = { version = "2", features = ["json"], optional = true }
wasmtime = { version = "50", features = ["anyhow"] }

[dev-dependencies]
tempfile = "3"
