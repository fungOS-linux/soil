[package]
name = "soil-install"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soil-spore = { path = "../soil-spore" }
soil-store = { path = "../soil-store" }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "soil-install"
path = "src/main.rs"
