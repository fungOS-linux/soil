[package]
name = "soil-store"
description = "Signed Spore Store index, update planning, and storefront snapshots"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
soil-spore = { path = "../soil-spore" }

[[bin]]
name = "soil-store"
path = "src/bin/soil-store.rs"

[lints]
workspace = true
