[package]
name = "soil-webgpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
soil-spore = { path = "../soil-spore" }
ureq = "2"
anyhow = "1"
wasi-webgpu-wasmtime = { git = "https://github.com/fungOS-linux/wasi-gfx-runtime", rev = "9624cae" }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
wasmtime = { version = "50", default-features = false, features = [
    "anyhow",
    "async",
    "component-model",
    "component-model-async",
    "cranelift",
    "runtime",
    "std",
] }
pollster = "0.4"
sha2 = "0.10"

[dev-dependencies]
wat = "1"

[[bin]]
name = "soil-webgpu"
path = "src/bin/soil-webgpu.rs"
