[package]
name = "soil-crm-espo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "soil-crm-espo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fungos-records.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
