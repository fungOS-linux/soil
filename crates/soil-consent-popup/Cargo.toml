[package]
name = "soil-consent-popup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soil-consent = { path = "../soil-consent" }
wgpu = { version = "27", features = ["metal"] }
