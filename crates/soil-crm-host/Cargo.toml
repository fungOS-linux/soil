[package]
name = "soil-crm-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "soil-crm"
path = "src/bin/soil-crm.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fungos-records = { git = "https://github.com/fungOS-linux/records.git", rev = "46450ede02588e533984378bc979cb4010f9867b" }
serde_json = "1"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
