[package]
name = "soil-dev-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "soil-dev-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
soil-ble-host = { path = "../soil-ble-host" }
soil-records-host = { path = "../soil-records-host" }
soil-wasi-host = { path = "../soil-wasi-host" }
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = "50"
