[package]
name = "mush"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "mush"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rustyline = "17"
ignore = "0.4"
libc = "0.2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soil-inference = { path = "../soil-inference" }
soil-host = { path = "../soil-host" }
soil-scrub = { path = "../soil-scrub" }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
fungos-vfs = { git = "https://github.com/mycelium-linux/fungos-vfs.git", rev = "8ad45a7fb1ce01fbbc6f764d10524baf5a24c0af" }
soil-command = { path = "../soil-command" }
soil-spore = { path = "../soil-spore" }
tempfile = "3"
wasmtime = { version = "50", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile = "3"
