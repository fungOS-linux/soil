[package]
name = "mush"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "mush"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rustyline = "17"
ignore = "0.4"
libc = "0.2"
rand = "0.9"
serde_json = "1"
soil-inference = { path = "../soil-inference" }
soil-scrub = { path = "../soil-scrub" }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
fungos-vfs = { git = "https://github.com/fungOS-linux/fungos-vfs.git", rev = "bcd2bc682662467d1371a2c9f8436e08934132d9" }
soil-vfs-host = { path = "../soil-vfs-host" }
soil-command = { path = "../soil-command" }
tempfile = "3"
wasmtime = { version = "50", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile = "3"
