[package]
name = "soil-ble-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "soil-ble-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
wasmtime = { version = "50", features = ["anyhow"] }
wasmtime-wasi = "50"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
btleplug = "0.11"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Static libdbus so the S22/musl host does not need a target sysroot.
libdbus-sys = { version = "0.2", features = ["vendored"] }
