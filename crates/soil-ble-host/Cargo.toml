[package]
name = "soil-ble-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "soil-ble-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
wasmtime = "34"
wasmtime-wasi = "34"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
btleplug = "0.11"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
