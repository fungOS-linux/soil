[package]
name = "soil-terminal-web"
description = "A browser terminal: pty -> soil-vt -> an SSE grid"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
portable-pty = "0.9"
serde_json = "1"
