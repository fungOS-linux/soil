[package]
name = "soil-tasks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "soil-task"
path = "src/bin/soil-task.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fungos-records = { git = "https://github.com/fungOS-linux/records.git", rev = "46450ede02588e533984378bc979cb4010f9867b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soil-mentions = { path = "../soil-mentions" }

[dev-dependencies]
tempfile = "3"
