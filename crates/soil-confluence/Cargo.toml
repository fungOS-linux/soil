[package]
name = "soil-confluence"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.2"
clap = { version = "4", features = ["derive", "env"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soil-wasi-host = { path = "../soil-wasi-host" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unibus = { git = "https://github.com/mycelium-linux/unibus.git", rev = "8bf8f79" }

[lints]
workspace = true
