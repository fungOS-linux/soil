[package]
name = "soil-confluence"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
http = "1"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
standardwebhooks = "1.0.1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unibus = { git = "https://github.com/fungOS-linux/unibus.git", rev = "8bf8f79" }
unibus-sdk = { git = "https://github.com/fungOS-linux/unibus.git", rev = "8bf8f79" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
