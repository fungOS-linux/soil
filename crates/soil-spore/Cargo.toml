[package]
name = "soil-spore"
description = "Spore package format: manifest, lock, deterministic tar, PGP sidecar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tar = "0.4"
toml = "0.8"

[[bin]]
name = "soil-spore"
path = "src/bin/soil-spore.rs"

[lints]
workspace = true
