[package]
name = "soil-spore"
description = "Spore package format: manifest, lock, deterministic tar, PGP sidecar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
tar = "0.4"
tempfile = "3"
toml = "0.8"
# Reading a component's real imports is what lets `check` hold the manifest to
# the module instead of the other way round.
wit-component = "0.247"
wit-parser = "0.247"
# Drain on SIGTERM. An ephemeral node being replaced must leave the pool when
# its supervisor stops it, not one lease TTL later. `signal-hook` is the safe
# way to do that in a blocking loop: this crate forbids unsafe, and there is no
# async runtime here to borrow a signal from.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[[bin]]
name = "soil-spore"
path = "src/bin/soil-spore.rs"

[lints]
workspace = true
