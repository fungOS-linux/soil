[package]
name = "soil-search-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
fungos-records = { git = "https://github.com/fungOS-linux/records.git", rev = "46450ede02588e533984378bc979cb4010f9867b" }
soil-spore = { path = "../soil-spore" }
soil-marbles = { path = "../soil-marbles" }
soil-vfs-host = { path = "../soil-vfs-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "50", features = ["anyhow"] }

[dev-dependencies]
fungos-vfs = { git = "https://github.com/fungOS-linux/fungos-vfs.git", rev = "bcd2bc682662467d1371a2c9f8436e08934132d9" }
serde_json = "1"
tempfile = "3"
