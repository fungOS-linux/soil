[package]
name = "soil-search-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
fungos-records.workspace = true
soil-spore = { path = "../soil-spore" }
soil-marbles = { path = "../soil-marbles" }
soil-vfs-host = { path = "../soil-vfs-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
wasmtime = { version = "50", features = ["anyhow"] }

[dev-dependencies]
fungos-vfs = { git = "https://github.com/fungOS-linux/fungos-vfs.git", rev = "8ad45a7fb1ce01fbbc6f764d10524baf5a24c0af" }
serde_json = "1"
tempfile = "3"
