[package]
name = "soil-web-bridge"
description = "HTTP + WebSocket bridge from a browser to Soil host capabilities"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
soil = { path = "../soil" }
soil-spore = { path = "../soil-spore" }
tungstenite = "0.30"

[dev-dependencies]
base64 = "0.22"
soil = { path = "../soil" }
tempfile = "3"
tungstenite = "0.30"

[[bin]]
name = "soil-web-bridge"
path = "src/main.rs"

[lints]
workspace = true
