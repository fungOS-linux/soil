[package]
name = "soil-sync-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
soil-notify-host = { path = "../soil-notify-host", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
ed25519-dalek = "2.2"
fungos-records.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
unibus = { git = "https://github.com/mycelium-linux/unibus.git", rev = "8bf8f79" }
unibus-iroh = { git = "https://github.com/mycelium-linux/unibus.git", rev = "8bf8f79", features = ["transport", "fleet-identity"] }
mycelium-peer-protocol = { git = "https://github.com/ajmwagar/mycelium.git", rev = "83a8cf8a818c29db84845eba8128477f38ab39ca" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[features]
notify = ["dep:soil-notify-host"]
