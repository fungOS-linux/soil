[package]
name = "soil-sync-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
fungos-records = { git = "https://github.com/fungOS-linux/records.git", rev = "2cb20ef53b4fa47e66aa0fea8a3d13c3c25be8c3" }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
unibus = { git = "https://github.com/fungOS-linux/unibus.git", rev = "89f7e5eda8426c13d6e7d71a433b0d82d2c37392" }
unibus-iroh = { git = "https://github.com/fungOS-linux/unibus.git", rev = "89f7e5eda8426c13d6e7d71a433b0d82d2c37392", features = ["transport"] }

[dev-dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
serde_json = "1"
tempfile = "3"
