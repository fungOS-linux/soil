[package]
name = "soil-layout"
description = "Deterministic host-side layout for Soil and Canvas UI trees"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
taffy = { version = "0.15", features = ["taffy_tree", "serde"] }
