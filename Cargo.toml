[workspace]
members = ["crates/soil-abi", "crates/soil-sdk-unibus", "crates/soil-sdk-lua", "crates/soil-ble-host", "crates/soil-ble-api", "crates/soil-ble-sim", "crates/soil-dev-host", "crates/soil-canvas-input", "crates/soil-android", "crates/soil-runtime", "crates/s22-canvas-surface", "crates/soil-webgpu", "crates/soil-process", "crates/cpal-soil", "crates/fungos-content", "crates/soil-vfs-host", "crates/wasi-audio-wasmtime", "crates/soil-sdk", "crates/soil-sdk-audio", "crates/soil-sdk-codec", "crates/soil-sdk-appdata", "crates/soil-sdk-records", "crates/viewer-spore", "crates/soil-spore", "crates/soil-store", "crates/soil-home", "crates/soil-dfm-viz", "crates/soil-records-host", "crates/soil-appdata-host", "crates/soil-search-host", "crates/soil-shell", "crates/mush", "crates/soil-http-host", "crates/soil-sync-host", "crates/soil-actions-host", "crates/soil-canvas-actions-host", "crates/soil-scrub", "crates/soil-inference", "crates/soil-inference-host", "crates/soil-media-host", "crates/soil-surface-import-host", "crates/soil-notify-host", "crates/soil-crm-espo", "crates/soil-crm-host", "crates/soil-mentions", "crates/soil-principal-host", "crates/soil-marbles", "crates/soil-consent", "crates/soil-consent-popup", "crates/soil-marbles-import", "crates/soil-command", "crates/soil-conversation", "crates/soil-confluence", "crates/soil-edge", "crates/soil-iroh-http", "crates/soil-wasi-host", "crates/soil-scene", "crates/soil-lua", "crates/soil-layout", "crates/soil-input", "crates/soil-vt", "crates/soil-terminal", "crates/soil-terminal-web", "crates/soil-termd", "crates/soil-scene-gpu", "crates/soil-ui-demo", "crates/soil-sdk-canvas", "crates/soil-canvas-host"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/fungOS-linux/soil"

# `fungos-records` is the on-disk records format shared by the records host, the
# sync host and every book consumer. Two revisions in one workspace means two
# incompatible `Store` types and two `unibus` copies, so it is declared once
# here and only here; a bump is one edit that moves every crate together.
[workspace.dependencies]
fungos-records = { git = "https://github.com/fungOS-linux/records.git", rev = "adc88b242957e5ee9b82d7e98f36d92a051635db" }

[workspace.lints.rust]
unsafe_code = "forbid"
