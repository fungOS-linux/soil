[workspace]
members = ["crates/soil-abi", "crates/soil-layout", "crates/soil-ble-host", "crates/soil-canvas-input", "crates/soil-webgpu", "crates/soil-process", "crates/cpal-soil", "crates/fungos-content", "crates/soil-vfs-host", "crates/wasi-audio-wasmtime", "crates/soil-sdk", "crates/soil-sdk-audio", "crates/soil-sdk-codec", "crates/soil-sdk-appdata", "crates/soil-sdk-records", "crates/viewer-spore", "crates/soil-spore", "crates/soil-records-host", "crates/soil-vt", "crates/soil-terminal"]
# soil-runtime and soil-android depend on sibling worktrees that are not present
# in this checkout (fpl/gfx .worktrees/s22-software, reversal .worktrees/s22-gpu-ui),
# so the whole workspace cannot resolve while they are members. Excluded rather
# than deleted: the code is someone's work in progress. Re-include both when the
# paths exist again.
exclude = ["crates/soil-runtime", "crates/soil-android", "spores/colmi-ring", "crates/soil-webgpu/fixtures/hello-compute", "crates/soil-webgpu/fixtures/wgpu-compute", "crates/soil-webgpu/fixtures/wgpu-canvas", "crates/wasi-audio-wasmtime/fixtures/tone", "crates/soil-process/fixtures/cpal-tone"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/fungOS-linux/soil"

[workspace.lints.rust]
unsafe_code = "forbid"
